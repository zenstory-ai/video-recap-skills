name: Skill Validate
on:
  # Run on every PR so the required status checks always report — a path filter
  # here would let docs-only PRs stall forever under branch protection.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install --disable-pip-version-check ruff==0.15.11 pytest==9.0.2
      - name: Lint (all skills + tests)
        run: ruff check skills tests scripts
      - name: Tests and packaging contracts (one isolated process per skill)
        run: python scripts/test.py
