name: Skill Validate
on:
  # Run on every PR so the required status checks always report — a path filter
  # here would let docs-only PRs stall forever under branch protection.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Install ffmpeg (with libass) on Linux and enforce RECAP_REQUIRE_FFMPEG=1
      # so the ~116 real ffmpeg/ffprobe render tests run fail-closed on every PR.
      # macOS and Windows stay focused on cross-platform Python/path/packaging
      # validation without slow Homebrew/Chocolatey media installs.
      - name: Install ffmpeg with libass (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -version
          ffmpeg -hide_banner -filters | grep -E '(^|[[:space:]])(subtitles|ass)([[:space:]]|$)'
      - name: Install deps
        run: python -m pip install --disable-pip-version-check ruff==0.15.11 pytest==9.0.2
      - name: Lint (all skills + tests)
        run: ruff check skills tests scripts
      - name: Tests and packaging contracts (one isolated process per skill)
        env:
          RECAP_REQUIRE_FFMPEG: ${{ runner.os == 'Linux' && '1' || '' }}
        run: python scripts/test.py
