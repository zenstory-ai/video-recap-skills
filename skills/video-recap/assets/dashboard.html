<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Recap Studio</title>
<style>
:root {
  --bg: #faf5ea; --surface: #fdfbf5; --surface-2: #f2ebdc; --line: #e2d8c5;
  --ink: #081431; --ink-2: #4b5468; --accent: #0891b2; --accent-bg: rgba(8,145,178,.11);
  --ok: #2e7a4c; --ok-bg: rgba(46,122,76,.11); --warn: #9a6410; --warn-bg: rgba(190,128,20,.14);
  --fail: #b3302a; --fail-bg: rgba(179,48,42,.10);
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1326; --surface: #111c36; --surface-2: #172444; --line: #26365e;
    --ink: #f3ecdc; --ink-2: #a9b6d0; --accent: #22d3ee; --accent-bg: rgba(34,211,238,.14);
    --ok: #4ade80; --ok-bg: rgba(74,222,128,.14); --warn: #fbbf24; --warn-bg: rgba(251,191,36,.16);
    --fail: #f87171; --fail-bg: rgba(248,113,113,.15);
  }
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--ink); font-size: 13.5px; line-height: 1.5; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 10; }
header h1 { margin: 0; font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.nav { display: flex; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 5px 11px; border-radius: 7px; cursor: pointer; font: inherit; font-size: 12.5px; }
.btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.layout { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 48px); }
.layout.single { grid-template-columns: 1fr; }
aside { border-right: 1px solid var(--line); padding: 12px; background: var(--surface); overflow-y: auto; }
aside h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); margin: 12px 0 6px; }
aside h2:first-child { margin-top: 0; }
.rail-item { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; color: var(--ink); padding: 7px 9px; border-radius: 7px; cursor: pointer; margin-bottom: 4px; font: inherit; }
.rail-item:hover { background: var(--surface-2); }
.rail-item.active { background: var(--accent-bg); border-color: var(--accent); font-weight: 600; }
.rail-sub { display: block; font-size: 11px; color: var(--ink-2); font-family: var(--mono); }
main { padding: 16px 20px; overflow-y: auto; }
.stage-grid { display: grid; grid-template-columns: minmax(320px, 1.15fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 960px) { .layout { grid-template-columns: 1fr; } .stage-grid { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
.card h3 { margin: 0 0 10px; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; }
video { width: 100%; max-height: 62vh; background: #000; border-radius: 8px; display: block; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--ink-2); font-family: var(--mono); }
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
.badge.pass, .badge.ok, .badge.owned, .badge.cc0, .badge.licensed { background: var(--ok-bg); color: var(--ok); }
.badge.warn, .badge.skip, .badge.unknown { background: var(--warn-bg); color: var(--warn); }
.badge.fail, .badge.restricted, .badge.denied { background: var(--fail-bg); color: var(--fail); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.row-list { max-height: 58vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.cue { border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; cursor: pointer; transition: border-color .12s, background .12s; }
.cue:hover { border-color: var(--accent); }
.cue.now { background: var(--accent-bg); border-color: var(--accent); }
.cue .tc { font-family: var(--mono); font-size: 11.5px; color: var(--accent); margin-right: 8px; }
.lane { margin-bottom: 8px; }
.lane-label { font-size: 11px; font-family: var(--mono); color: var(--ink-2); margin-bottom: 3px; }
.lane-bar { position: relative; height: 22px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.lane-seg { position: absolute; top: 2px; bottom: 2px; background: var(--accent); opacity: .75; border-radius: 3px; cursor: pointer; min-width: 2px; }
.lane-seg.sfx { background: #d97706; }
.lane-seg.bgm { background: #2e7a4c; opacity: .5; }
.lane-seg.ovl { background: #7c3aed; }
.check-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.check-row:last-child { border-bottom: 0; }
.hints-box { margin-top: 10px; padding: 8px 10px; border-radius: 7px; background: var(--warn-bg); }
.hints-box h4 { margin: 0 0 6px; font-size: 12px; color: var(--warn); }
pre.md { white-space: pre-wrap; font-family: var(--sans); font-size: 12.5px; background: var(--surface-2); padding: 10px; border-radius: 7px; margin: 0; max-height: 52vh; overflow-y: auto; }
.asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.asset-card { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 12px; }
.asset-card audio { width: 100%; height: 32px; margin-top: 8px; }
.asset-card img { width: 100%; max-height: 140px; object-fit: contain; background: #000; border-radius: 6px; margin-top: 8px; }
.tag-row { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.search { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); font: inherit; margin-bottom: 10px; }
.empty { color: var(--ink-2); font-style: italic; padding: 12px 0; }
</style>
</head>
<body>
<header>
  <h1>Video Recap Studio <span id="modeBadge" class="badge ok"></span></h1>
  <div id="topNav" class="nav"></div>
</header>
<div id="layout" class="layout">
  <aside id="rail"></aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<script id="reviewData" type="application/json">__EMBEDDED_DATA__</script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const fmt = (s) => {
  const n = Math.max(0, Number(s) || 0);
  const m = Math.floor(n / 60), sec = (n % 60).toFixed(2).padStart(5, "0");
  return `${String(m).padStart(2, "0")}:${sec}`;
};
const safeTok = (v) => String(v ?? "").toLowerCase().replace(/[^a-z0-9_-]/g, "");

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "className") el.className = String(v);
      else if (k === "dataset") Object.entries(v).forEach(([dk, dv]) => { el.dataset[dk] = String(dv); });
      else if (k === "style") Object.entries(v).forEach(([sk, sv]) => { el.style[sk] = String(sv); });
      else if (k === "onClick") el.addEventListener("click", v);
      else if (k === "onInput") el.addEventListener("input", v);
      else if (k === "value") el.value = String(v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, String(v));
    }
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}

const badge = (cls, text) => h("span", { className: `badge ${safeTok(cls)}` }, text);
const state = { mode: "serve", view: "runs", overview: null, run: null, library: null, tab: "script", filter: "" };

function parseEmbedded() {
  const raw = ($("#reviewData")?.textContent || "").trim();
  if (!raw || raw === "__" + "EMBEDDED_DATA__") return null;
  try { return JSON.parse(raw); } catch { return null; }
}

function mediaUrl(path) {
  const s = String(path ?? "").trim();
  if (!s || /[\u0000-\u001f]/.test(s)) return "";
  if (state.mode !== "static") return `/api/media?path=${encodeURIComponent(s)}`;
  if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s) || s.startsWith("//")) return "";
  return s;
}

function renderRun(run) {
  state.run = run;
  const tl = run.timeline || {};
  const clips = run.clips || [];
  const subs = run.subtitles || [];
  const narr = run.narration || [];
  const chk = run.check || null;
  const dur = Number(run.duration_s || 0) || (clips.length ? clips[clips.length - 1].end : 0);
  const statusEl = chk ? badge(chk.ok ? "pass" : "fail", chk.ok ? "CHECK PASS" : "CHECK FAIL") : badge("warn", "NO CHECK");
  const vidSrc = mediaUrl(run.video_url);
  const videoEl = vidSrc
    ? h("video", { id: "player", controls: true, preload: "metadata", src: vidSrc })
    : h("div", { className: "empty" }, "No rendered MP4 found in this directory.");
  const canvas = tl.canvas ? `${tl.canvas.width}×${tl.canvas.height} @ ${tl.canvas.fps || 30}` : "—";

  const seekTo = (t) => {
    const video = $("#player");
    if (!video) return;
    video.currentTime = Number(t) || 0;
    video.play().catch(() => {});
  };

  const lanes = [
    ["VIDEO", clips.map((c) => ({ s: c.start, e: c.end, label: `${c.id || ""} (${c.source})`, cls: "" }))],
    ["NARR", narr.map((n) => ({ s: n.at, e: n.at + (n.duration || 1), label: n.text || n.id, cls: "" }))],
    ["BGM", (tl.audio?.bgm || []).map((b) => ({ s: b.at || 0, e: b.out || dur, label: b.source || "bgm", cls: "bgm" }))],
    ["SFX", (tl.audio?.sfx || []).map((x) => ({ s: x.at || 0, e: (x.at || 0) + 0.5, label: x.source || x.id, cls: "sfx" }))],
    ["OVL", (tl.overlays || []).map((o) => ({ s: o.start || 0, e: o.end || dur, label: o.id || o.source, cls: "ovl" }))],
  ].filter(([, items]) => items.length);

  const laneNodes = lanes.length ? lanes.map(([name, items]) =>
    h("div", { className: "lane" },
      h("div", { className: "lane-label" }, `${name} (${items.length})`),
      h("div", { className: "lane-bar" }, items.map((it) => {
        const left = dur > 0 ? Math.min(100, (it.s / dur) * 100) : 0;
        const width = dur > 0 ? Math.max(0.6, ((Math.max(it.e, it.s) - it.s) / dur) * 100) : 0;
        return h("div", {
          className: `lane-seg ${safeTok(it.cls)}`.trim(),
          dataset: { seek: it.s },
          title: `${it.label} (${fmt(it.s)}-${fmt(it.e)})`,
          style: { left: `${left.toFixed(2)}%`, width: `${width.toFixed(2)}%` },
          onClick: () => seekTo(it.s),
        });
      })),
    ),
  ) : [h("div", { className: "empty" }, "No timeline tracks.")];

  const tabs = [
    ["script", `Script (${subs.length || narr.length})`],
    ["clips", `Clips (${clips.length})`],
    ["checks", "Checks"],
    ["plan", "Plan / Notes"],
  ];
  const tabBar = h("div", { className: "tabs" }, tabs.map(([k, label]) =>
    h("button", {
      className: `btn ${state.tab === k ? "active" : ""}`.trim(),
      dataset: { tab: k },
      onClick: () => { state.tab = k; renderRun(run); },
    }, label),
  ));

  let panelNode;
  if (state.tab === "script") {
    const rows = subs.length
      ? subs.map((s) => ({ start: s.start, end: s.end, text: s.text, tag: s.style || "sub" }))
      : narr.map((n) => ({ start: n.at, end: n.at + (n.duration || 0), text: n.text || n.file, tag: "narr" }));
    panelNode = rows.length
      ? h("div", { className: "row-list" }, rows.map((r) =>
          h("div", { className: "cue", dataset: { start: r.start, end: r.end, seek: r.start }, onClick: () => seekTo(r.start) },
            h("span", { className: "tc" }, `${fmt(r.start)}–${fmt(r.end)}`),
            badge("warn", r.tag),
            ` ${r.text ?? ""}`,
          ),
        ))
      : h("div", { className: "empty" }, "No subtitles or narration segments.");
  } else if (state.tab === "clips") {
    panelNode = clips.length
      ? h("div", { className: "row-list" }, clips.map((c) =>
          h("div", { className: "cue", dataset: { start: c.start, end: c.end, seek: c.start }, onClick: () => seekTo(c.start) },
            h("span", { className: "tc" }, `${fmt(c.start)}–${fmt(c.end)}`),
            h("strong", null, c.id || c.source),
            " ",
            h("span", { className: "rail-sub" }, `src ${c.source} [${fmt(c.src_in)}–${fmt(c.src_out)}]`),
          ),
        ))
      : h("div", { className: "empty" }, "No video clips.");
  } else if (state.tab === "checks") {
    if (!chk) {
      panelNode = h("div", { className: "empty" }, "No check.json found. Run check.py to populate physical checks.");
    } else {
      const checkRows = Object.entries(chk.checks || {}).map(([k, v]) =>
        h("div", { className: "check-row" },
          h("div", null, h("strong", null, k), h("div", { className: "rail-sub" }, v.detail || "")),
          badge(v.status, v.status),
        ),
      );
      const hints = Array.isArray(chk.review_hints) ? chk.review_hints : [];
      const hintsNode = hints.length
        ? h("div", { className: "hints-box" },
            h("h4", null, `Review Hints (${hints.length})`),
            hints.map((hint) => {
              const code = hint.code || hint.check || "hint";
              const msg = hint.message || hint.detail || JSON.stringify(hint);
              const ts = hint.at != null ? ` @ ${fmt(hint.at)}` : (hint.start != null ? ` [${fmt(hint.start)}–${fmt(hint.end ?? hint.start)}]` : "");
              return h("div", { className: "rail-sub" }, `• [${code}${ts}] ${msg}`);
            }),
          )
        : null;
      const lims = (chk.limitations || []).map((x) => h("div", { className: "rail-sub" }, `• ${x}`));
      panelNode = h("div", null, h("div", null, checkRows), hintsNode, lims.length ? h("div", { style: { marginTop: "10px" } }, lims) : null);
    }
  } else {
    const docs = Object.entries(run.notes || {});
    panelNode = docs.length
      ? h("div", null, docs.flatMap(([name, text]) => [h("h4", null, name), h("pre", { className: "md" }, text)]))
      : h("div", { className: "empty" }, "No BRIEF.md, MEDIA_NOTES.md, or EDIT_PLAN.md in workspace.");
  }

  const stage = h("div", { className: "stage-grid" },
    h("div", null,
      h("div", { className: "card" },
        h("h3", null, h("span", null, run.title || run.path || "Run"), statusEl),
        videoEl,
        h("div", { className: "meta-row" },
          h("span", null, `Duration: ${fmt(dur)}`),
          h("span", null, `Canvas: ${canvas}`),
          h("span", null, `Clips: ${clips.length}`),
        ),
      ),
      h("div", { className: "card" }, h("h3", null, "Timeline Lanes"), laneNodes),
    ),
    h("div", { className: "card" }, tabBar, panelNode),
  );
  $("#main").replaceChildren(stage);

  const video = $("#player");
  if (video) {
    video.addEventListener("timeupdate", () => {
      const t = video.currentTime;
      $("#main").querySelectorAll(".cue[data-start]").forEach((el) => {
        const s = Number(el.dataset.start), e = Number(el.dataset.end);
        el.classList.toggle("now", t >= s && (e <= s || t <= e));
      });
    });
  }
}

function renderLibrary(lib) {
  state.library = lib;
  const q = state.filter.trim().toLowerCase();
  const items = (lib.assets || []).filter((a) => !q || JSON.stringify(a).toLowerCase().includes(q));
  const mats = (lib.materials || []).filter((m) => !q || JSON.stringify(m).toLowerCase().includes(q));

  const assetCards = items.length ? items.map((a) => {
    const mUrl = mediaUrl(a.media_url);
    const mediaNode = !mUrl ? null
      : a.media_kind === "audio" ? h("audio", { controls: true, preload: "none", src: mUrl })
      : a.media_kind === "image" ? h("img", { src: mUrl, alt: a.id || "asset" })
      : null;
    const tagNodes = (a.tags || []).map((t) => badge("warn", t));
    return h("div", { className: "asset-card" },
      h("div", null,
        h("strong", null, a.id || ""), " ",
        badge("ok", a.kind || "asset"), " ",
        badge(a.license || "unknown", a.license || "unknown"),
      ),
      h("div", { className: "rail-sub" }, a.path || ""),
      tagNodes.length ? h("div", { className: "tag-row" }, tagNodes) : null,
      mediaNode,
    );
  }) : [h("div", { className: "empty" }, "No catalog assets.")];

  const matRows = mats.length ? mats.map((m) =>
    h("div", { className: "check-row" },
      h("div", null, h("strong", null, m.id || ""), h("div", { className: "rail-sub" }, (m.files || []).join(", "))),
    ),
  ) : [h("div", { className: "empty" }, "No cached materials.")];

  const searchInput = h("input", {
    id: "libSearch",
    className: "search",
    placeholder: "Filter by id, kind, tag, license…",
    value: state.filter,
    onInput: (e) => {
      state.filter = e.target.value;
      renderLibrary(lib);
      const inp = $("#libSearch");
      if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    },
  });

  $("#main").replaceChildren(
    h("div", { className: "card" },
      h("h3", null, h("span", null, `Library: ${lib.name || lib.path}`), badge("ok", `${items.length} assets · ${mats.length} materials`)),
      searchInput,
      h("div", { className: "asset-grid" }, assetCards),
    ),
    h("div", { className: "card" }, h("h3", null, "Cached Materials"), matRows),
  );
}

async function api(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

function renderRail() {
  const ov = state.overview || { runs: [], libraries: [] };
  const runNodes = ov.runs.length ? ov.runs.map((r) =>
    h("button", {
      className: `rail-item ${state.view === "runs" && state.run?.path === r.path ? "active" : ""}`.trim(),
      dataset: { run: r.path },
      onClick: async () => {
        state.view = "runs";
        renderRun(await api(`/api/run?path=${encodeURIComponent(r.path)}`));
        renderRail();
      },
    }, r.title, h("span", { className: "rail-sub" }, r.path)),
  ) : [h("div", { className: "empty" }, "None")];

  const libNodes = ov.libraries.length ? ov.libraries.map((l) =>
    h("button", {
      className: `rail-item ${state.view === "library" && state.library?.path === l.path ? "active" : ""}`.trim(),
      dataset: { lib: l.path },
      onClick: async () => {
        state.view = "library";
        renderLibrary(await api(`/api/library?path=${encodeURIComponent(l.path)}`));
        renderRail();
      },
    }, l.name, h("span", { className: "rail-sub" }, l.path)),
  ) : [h("div", { className: "empty" }, "None")];

  $("#rail").replaceChildren(
    h("h2", null, `Runs (${ov.runs.length})`),
    ...runNodes,
    h("h2", null, `Libraries (${ov.libraries.length})`),
    ...libNodes,
  );
}

async function boot() {
  const embedded = parseEmbedded();
  if (embedded) {
    state.mode = "static";
    $("#modeBadge").textContent = "STATIC REVIEW";
    $("#layout").classList.add("single");
    $("#rail").style.display = "none";
    renderRun(embedded);
    return;
  }
  state.mode = "serve";
  $("#modeBadge").textContent = "READ-ONLY SERVER";
  state.overview = await api("/api/overview");
  renderRail();
  if (state.overview.runs.length) {
    renderRun(await api(`/api/run?path=${encodeURIComponent(state.overview.runs[0].path)}`));
    renderRail();
  } else if (state.overview.libraries.length) {
    state.view = "library";
    renderLibrary(await api(`/api/library?path=${encodeURIComponent(state.overview.libraries[0].path)}`));
    renderRail();
  } else {
    $("#main").replaceChildren(h("div", { className: "card" }, h("div", { className: "empty" }, "No timeline.json runs or catalog.json libraries discovered under --root.")));
  }
}
boot().catch((err) => {
  $("#main").replaceChildren(h("div", { className: "card" }, badge("fail", "ERROR"), ` ${err?.message || err}`));
});
</script>
</body>
</html>
